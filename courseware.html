<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="7W8YRxUpQwBzWUNiP5Fjde">
<head data-page-node-id="0Cu3FVFzl6ZIlrPvsnDnPJ">
<meta charset="UTF-8" data-page-node-id="lcxZ7k2lkDmFeLH1K6bN6E">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="ty7QoGHVJBbLUjDq3XwWCB">
<title>国际供应链 · 总览</title>
<script src="/marked.min.js"></script>
<style>
  :root{
    --bg:#fafaf7; --surface:#fff; --surface-2:#f4f3ee; --border:#e5e3da; --border-strong:#d3d1c7;
    --text:#1a1a17; --text-2:#5f5e5a; --text-3:#888780; --primary:#534ab7; --primary-soft:#eeedfe;
    --danger:#a32d2d; --success:#0f6e56; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04); --radius:8px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);background:var(--bg);font-size:15px;line-height:1.7;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;}
  header .brand{font-size:16px;font-weight:600;}
  header .brand small{color:var(--text-3);font-weight:400;font-size:12px;margin-left:8px;}
  header .spacer{flex:1;}
  select#cwSelect{min-width:260px;max-width:420px;padding:7px 10px;border:1px solid var(--border-strong);
    border-radius:var(--radius);font-size:14px;background:var(--surface);color:var(--text);}
  select#cwSelect:focus{outline:none;border-color:var(--primary);}
  a.back{color:var(--primary);text-decoration:none;font-size:13px;border:1px solid var(--border-strong);
    padding:6px 12px;border-radius:var(--radius);background:var(--surface);}
  a.back:hover{background:var(--surface-2);}
  #status{color:var(--text-3);font-size:13px;padding:12px 20px;min-height:20px;}
  main{max-width:920px;margin:0 auto;padding:8px 24px 80px;}
  /* 阅读区排版 */
  .md h1{font-size:26px;margin:.4em 0 .3em;border-bottom:2px solid var(--primary);padding-bottom:.2em;}
  .md h2{font-size:21px;margin:1.4em 0 .5em;padding-left:10px;border-left:4px solid var(--primary);}
  .md h3{font-size:17px;margin:1.2em 0 .4em;color:#33312c;}
  .md p{margin:.6em 0;}
  .md ul,.md ol{padding-left:1.6em;margin:.5em 0;}
  .md li{margin:.25em 0;}
  .md a{color:var(--primary);}
  .md code{background:var(--surface-2);padding:2px 6px;border-radius:4px;font-size:13px;
    font-family:"SF Mono",Consolas,Menlo,monospace;}
  .md pre{background:#1f1d2b;color:#e9e7f5;padding:14px 16px;border-radius:var(--radius);overflow:auto;font-size:13px;}
  .md pre code{background:transparent;color:inherit;padding:0;}
  .md blockquote{margin:.8em 0;padding:.4em 1em;background:var(--primary-soft);
    border-left:4px solid var(--primary);color:#3b3470;border-radius:0 var(--radius) var(--radius) 0;}
  .md table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14px;display:block;overflow-x:auto;}
  .md th,.md td{border:1px solid var(--border-strong);padding:8px 12px;text-align:left;vertical-align:top;}
  .md th{background:var(--surface-2);font-weight:600;}
  .md tr:nth-child(even) td{background:#fcfcfa;}
  .md hr{border:none;border-top:1px solid var(--border);margin:1.6em 0;}
  .md strong{color:#231f3a;}
  .md-img{max-width:100%;}
  .empty{color:var(--text-3);text-align:center;padding:80px 0;font-size:15px;}
  .pill{display:inline-block;background:var(--primary-soft);color:var(--primary);border-radius:999px;
    padding:2px 10px;font-size:12px;margin-left:8px;}
</style>

<body data-page-node-id="Yt5MqrJuRwXBVdYrXDHa0r">
<header data-page-node-id="56clMs3y1ONIrZhV6tilTr">
  <span class="brand" data-page-node-id="nwGlHlt84pkNIqUEQAcWvN">📚 国际供应链 · 总览<small data-page-node-id="29dd9LEbywKHUaI9e550Y2">课件阅读</small></span>
  <span class="spacer" data-page-node-id="dYhGSdRuP4zJewIDtQb2AV"></span>
  <select id="cwSelect" aria-label="选择课件" data-page-node-id="mVppJG75Szv7Tqy9mlbab7"><option value="" data-page-node-id="aEQ8YVqYfYsgQ4esNN1zI9">— 请选择课件 —</option></select>
  <a class="back" href="/" title="返回知识图谱工作台" data-page-node-id="h4bktEYcHAYtZ8dB9XBwNP">← 工作台</a>
</header>
<div id="status" data-page-node-id="UNrfjd7igkh9iuq8sktvhP">加载课件列表…</div>
<main data-page-node-id="Ne1mnInyvIk0TERqjrO7Bq">
  <article id="content" class="md" data-page-node-id="XocYOWFNQaRsCwd8mDFezD"><div class="empty" data-page-node-id="Ni0YBcqmjjwBbD7NhW8tcj">从右上角下拉选择课件，即可在此阅读对应内容。</div></article>
</main>

<script>
const sel = document.getElementById('cwSelect');
const content = document.getElementById('content');
const status = document.getElementById('status');
let list = [];

function render(text){
  content.innerHTML = marked.parse(text);
  window.scrollTo(0, 0);
}

function load(id){
  const item = list.find(x => x.id === id);
  if(!item){ status.textContent = '未找到该课件'; return; }
  status.innerHTML = '正在加载：' + item.title;
  fetch('/api/md/' + encodeURIComponent(id))
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(t => { render(t); status.innerHTML = '当前：<b>'+item.title+'</b>'; })
    .catch(e => { status.textContent = '加载失败：' + e.message; });
}

sel.addEventListener('change', () => {
  const id = sel.value;
  if(!id) return;
  history.replaceState(null, '', '#' + id);
  load(id);
});

fetch('/api/courseware')
  .then(r => r.json())
  .then(arr => {
    list = arr;
    arr.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.title;
      sel.appendChild(o);
    });
    // 深链：#id 直达
    const hash = (location.hash || '').replace('#','');
    const initial = (hash && list.find(x=>x.id===hash)) ? hash : 'manual';
    sel.value = initial;
    if(initial) load(initial);
  })
  .catch(e => { status.textContent = '课件列表加载失败：' + e.message; });
</script>
</body>
</html>
